<script>
const stage=document.getElementById('stage');
const objects=[...stage.querySelectorAll('.float-object')];
const panels=[...stage.querySelectorAll('.interactive-panel')];
const orb=document.getElementById('cursorOrb');
const detailMount=document.getElementById('detailMount');
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const pointerFine=window.matchMedia('(hover:hover) and (pointer:fine)').matches;
const state=new Map();
objects.forEach(el=>state.set(el,{x:0,y:0,vx:0,vy:0,rot:0,vr:0,tx:0,ty:0,tr:parseFloat(el.dataset.angle||'0'),userX:0,userY:0,dragStart:null,dragged:false,suppressClick:false,depth:parseFloat(el.dataset.depth||'1')}));
let pointer=null,raf=0,opened=null,openingRect=null;
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
function renderFrame(){
  raf=0;
  const sr=stage.getBoundingClientRect();
  const canMove=pointer && !opened && !reducedMotion && pointerFine;
  objects.forEach(el=>{
    const s=state.get(el);

const details={
 manifeste:`<div class="detail-head"><span>01 — Manifeste</span><button class="close-detail" type="button">← Retour à la composition</button></div><div class="detail-main"><p class="detail-kicker">Une conviction</p><h2 class="detail-title">Il est normal d’avoir envie de confier son bien à quelqu’un que l’on connaît.</h2><p class="detail-lead">L’habitat est un sujet intime, essentiel. Un lieu de vie, une histoire et parfois un nouveau chapitre.</p><hr class="detail-rule"><p class="detail-copy">Confier son bien, ce n’est pas seulement confier des mètres carrés. C’est confier un lieu de vie, une histoire et parfois un nouveau chapitre.</p></div>`,
